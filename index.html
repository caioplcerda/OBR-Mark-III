<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibração do Robô</title>
    <style>/* ... estilos ... */</style>
</head>
<body>
    <!-- ... (estrutura HTML) ... -->
    <script>
    document.addEventListener('DOMContentLoaded', (event) => {

        function sendCommand(command, payload = {}) {
            console.log(`Enviando comando: ${command}`, payload);
            fetch('/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: command, ...payload })
            }).catch(error => console.error(`Erro no comando ${command}:`, error));
        }

        document.getElementById('start-button').addEventListener('click', () => sendCommand('start_robot'));

        document.getElementById('video-stream').addEventListener('click', function(e) {
            const rect = videoStream.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            const color = document.getElementById('color-to-calibrate').value;
            sendCommand('calibrate_pixel', { payload: { x, y, color } });
        });

        document.getElementById('view-normal').addEventListener('click', () => sendCommand('set_view_mode', { mode: 'normal' }));
        document.getElementById('view-mask').addEventListener('click', () => sendCommand('set_view_mode', { mode: 'mask' }));
        document.getElementById('view-contours').addEventListener('click', () => sendCommand('set_view_mode', { mode: 'contours' }));

        function fetchLogs() {
            fetch('/logs')
                .then(response => response.json())
                .then(data => {
                    const logConsole = document.getElementById('log-console');
                    const newContent = data.logs.join('<br>');
                    if (logConsole.innerHTML !== newContent) {
                        logConsole.innerHTML = newContent;
                        logConsole.scrollTop = logConsole.scrollHeight;
                    }
                });
        }
        setInterval(fetchLogs, 1500);
    });
    </script>
</body>
</html>

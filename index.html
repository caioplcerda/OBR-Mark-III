<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibração do Robô</title>
    <style>
        /* ... (estilos permanecem os mesmos) ... */
    </style>
</head>
<body>
    <div class="container">
        <h1>Stream do Robô</h1>
        <img class="stream" id="video-stream" src="/stream" />
        <div class="view-controls">
            <!-- ... (botões de visualização) ... -->
        </div>
    </div>
    <div class="container controls">
        <h1>Controles</h1>
        <button type="button" id="start-button">Iniciar Percurso</button>
        <hr>
        <h1>Calibração por Clique</h1>
        <p>Clique em "Ativar Calibração", depois selecione a cor e clique na imagem para calibrar.</p>
        <button id="toggle-calibration">Ativar Modo de Calibração</button>
        <div>
            <label>Cor para Calibrar:</label>
            <select id="color-to-calibrate">
                <option value="black">Preto (Linha)</option>
                <option value="green">Verde (Área de Resgate)</option>
                <option value="silver">Prata (Entrada Resgate)</option>
            </select>
        </div>
        <div class="log-container">
            <h3>Console de Logs</h3>
            <pre id="log-console"></pre>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', (event) => {
        const videoStream = document.getElementById('video-stream');

        videoStream.addEventListener('click', function(e) {
            const rect = videoStream.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);

            // Converte as coordenadas da imagem exibida (640x480) para as coordenadas da imagem real (se houver diferença)
            // Como agora são iguais, a conversão é 1:1, mas deixamos a lógica para o futuro.
            const realX = Math.round(x * (videoStream.naturalWidth / videoStream.clientWidth));
            const realY = Math.round(y * (videoStream.naturalHeight / videoStream.clientHeight));

            const color = document.getElementById('color-to-calibrate').value;

            console.log(`Clique para calibrar ${color} em (${realX}, ${realY})`);

            fetch('/calibrate_pixel', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x: realX, y: realY, color: color })
            });
        });

        document.getElementById('toggle-calibration').addEventListener('click', function() {
             // Esta é uma simplificação. A forma correta seria o botão
             // enviar um comando para o main.py mudar o estado para CALIBRATING.
             // Por enquanto, vamos assumir que o usuário pode clicar a qualquer momento
             // e o robô só irá processar no estado CALIBRATING.
             alert("Modo de calibração ativado/desativado no front-end. Use os controles de estado se necessário.");
        });

        // ... (outros listeners e funções) ...
    });
    </script>
</body>
</html>

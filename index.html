<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibração do Robô</title>
    <style>
        body { font-family: sans-serif; display: flex; }
        .container { display: flex; flex-direction: column; margin: 20px; }
        .stream { width: 480px; height: 640px; border: 1px solid black; }
        .controls { display: flex; flex-direction: column; }
        .slider-group { margin-bottom: 15px; padding: 10px; border-radius: 5px; }
        .hsv-black { background-color: #333; color: white; }
        .view-controls button { margin-right: 10px; }
        .log-container { margin-top: 20px; }
        #log-console {
            background-color: #111;
            color: #0f0;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stream do Robô</h1>
        <img class="stream" src="/stream" />
        <div class="view-controls">
            <h3>Modo de Visualização</h3>
            <button id="view-normal">Normal</button>
            <button id="view-mask">Máscara</button>
            <button id="view-contours">Contornos</button>
        </div>
    </div>
    <div class="container controls">
        <h1>Calibração</h1>
        <form id="calibration-form">
            <!-- ... sliders ... -->
            <button type="submit">Salvar Calibração</button>
            <button type="button" id="start-button">Iniciar Percurso</button>
        </form>
        <div class="log-container">
            <h3>Console de Logs</h3>
            <pre id="log-console"></pre>
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', (event) => {

        document.getElementById('start-button').addEventListener('click', () => fetch('/start', { method: 'POST' }));

        document.getElementById('calibration-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData.entries());
            fetch('/calibrate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        });

        function setViewMode(mode) {
            fetch('/set_view_mode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: mode })
            });
        }

        document.getElementById('view-normal').addEventListener('click', () => setViewMode('normal'));
        document.getElementById('view-mask').addEventListener('click', () => setViewMode('mask'));
        document.getElementById('view-contours').addEventListener('click', () => setViewMode('contours'));

        function fetchLogs() {
            fetch('/logs')
                .then(response => response.json())
                .then(data => {
                    const logConsole = document.getElementById('log-console');
                    const newContent = data.logs.join('<br>');
                    if (logConsole.innerHTML !== newContent) {
                        logConsole.innerHTML = newContent;
                        logConsole.scrollTop = logConsole.scrollHeight;
                    }
                });
        }

        setInterval(fetchLogs, 1500);
    });
    </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OBR Line Follower</title>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    #video { border: 1px solid #ccc; }
    #log { height: 160px; overflow: auto; background: #111; color:#0f0; padding:8px; }
    button { margin-right: 8px; margin-bottom:8px; }
    .row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <h2>OBR Line Follower</h2>

  <div class="row">
    <button id="start">Start Robot</button>
    <button id="stop">Stop Robot</button>
    <button data-mode="normal" class="mode">Normal</button>
    <button data-mode="mask" class="mode">Mask</button>
    <button data-mode="contours" class="mode">Contours</button>
    <button data-mode="derivative" class="mode">Derivatives</button>
    <button data-mode="preview" class="mode"><b>Preview</b></button>
    <span id="status">Status: —</span>
    <span id="fps">FPS: —</span>
    <span id="speeds">Speeds: —</span>
  </div>

  <div class="row">
    <img id="video" src="/stream" width="640" height="480" alt="stream">
    <div>
      <p>Clique no vídeo para calibrar uma cor:</p>
      <select id="color">
        <option value="black">Preto (linha)</option>
        <option value="white">Branco (fundo)</option>
        <option value="green">Verde (marcador)</option>
        <option value="red">Vermelho (chegada)</option>
      </select>
      <p><small>Clique na imagem para enviar as coordenadas originais 640×480.</small></p>
    </div>
  </div>

  <h3>Log</h3>
  <pre id="log"></pre>

  <script>
    const socket = io({ transports: ["polling"] });

    const logEl = document.getElementById("log");
    function addLog(t){ logEl.textContent += t + "\n"; logEl.scrollTop = logEl.scrollHeight; }

    socket.on("connect", () => addLog("Conectado ao Socket.IO."));
    socket.on("disconnect", () => addLog("Socket desconectado."));

    socket.on("log_message", (m) => addLog(m.text || JSON.stringify(m)));
    socket.on("status", (s) => {
      document.getElementById("status").textContent = "Status: " + (s.status ?? "—");
      document.getElementById("fps").textContent = "FPS: " + (s.fps ?? "—");
      const sp = s.speeds || {};
      document.getElementById("speeds").textContent = `Speeds: L=${sp.left ?? "—"} R=${sp.right ?? "—"}`;
    });

    // Poll leve para atualizar status
    setInterval(async () => {
      try {
        const res = await fetch("/state");
        const s = await res.json();
        document.getElementById("status").textContent = "Status: " + (s.status ?? "—");
        document.getElementById("fps").textContent = "FPS: " + (s.fps ?? "—");
        const sp = s.speeds || {};
        document.getElementById("speeds").textContent = `Speeds: L=${sp.left ?? "—"} R=${sp.right ?? "—"}`;
      } catch(e){}
    }, 1000);

    // Botões
    document.getElementById("start").onclick = () => {
      socket.emit("command", { name: "start_robot" });
    };
    document.getElementById("stop").onclick = () => {
      socket.emit("command", { name: "stop_robot" });
    };
    for (const b of document.querySelectorAll(".mode")) {
      b.onclick = () => socket.emit("command", { name: "set_view_mode", data: { mode: b.dataset.mode } });
    }

    // Calibração por clique
    const img = document.getElementById("video");
    img.addEventListener("click", ev => {
      const rect = img.getBoundingClientRect();
      const rx = (ev.clientX - rect.left) / rect.width;
      const ry = (ev.clientY - rect.top) / rect.height;
      const x = Math.round(rx * 640);
      const y = Math.round(ry * 480);
      const color = document.getElementById("color").value;
      socket.emit("command", { name: "calibrate_pixel", data: { x, y, color }});
      addLog(`calibrate_pixel: (${x},${y}) color=${color}`);
    });
  </script>
</body>
</html>
